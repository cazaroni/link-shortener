# Cloudflare Pages project config (used by `wrangler pages dev` / `wrangler pages deploy`).
name = "link-shortener"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "link-shortener-db"
# Placeholder works for local dev. After `npx wrangler login`, run
# `npx wrangler d1 create link-shortener-db` and paste the real id here.
database_id = "b1b2f296-a707-45e1-9094-35d9e59ee0bf"
migrations_dir = "migrations"
